[package]
name = "wkrun"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mhirii/wkrun"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[package.metadata.cargo-machete]
ignored = [
    "anyhow",
    "clap",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk",
    "thiserror",
    "tracing",
    "tracing-appender",
    "tracing-opentelemetry",
    "tracing-subscriber",
]