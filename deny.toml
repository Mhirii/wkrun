[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []
git-fetch-with-cli = true
maximum-db-staleness = "P90D"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
# `syn` is duplicated across the Rust ecosystem while the migration from
# syn 2.x to syn 3.x is in progress. `tracing-attributes` and
# `thiserror-impl` require syn 2.x; `clap_derive`, `async-trait`, and
# `displaydoc` require syn 3.x. This duplicate is genuinely unavoidable
# at the direct-dependency selection level and is tracked here until the
# upstream ecosystem finishes the migration.
skip-tree = [
    { name = "syn", version = "=2.0.119" },
]
workspace-dependencies = { duplicates = "deny", include-path-dependencies = true, unused = "deny" }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
allow-org = { github = [] }